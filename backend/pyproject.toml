[project]
name = "cortex-backend"
version = "0.1.0"
description = "Cortex RAG-Based Codebase Q&A backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Migrate>=4.0.0",
    "Flask-Security-Too>=5.3.0",
    "Flask-Cors>=4.0.0",
    "SQLAlchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "chromadb>=0.4.0",
    "google-genai>=0.1.0",
    "PyGithub>=2.1.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-languages>=1.8.0",
    "cryptography>=41.0.0",
    "gunicorn>=21.0.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
