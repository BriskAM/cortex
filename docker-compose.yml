version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cortex_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cortex_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex_backend
    restart: always
    command: gunicorn --bind 0.0.0.0:5000 backend.run:app
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cortex
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CHROMA_PERSIST_DIR=/app/chroma_data
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    volumes:
      - chroma_data:/app/chroma_data

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex_worker
    restart: always
    command: celery -A backend.app.extensions.celery worker --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cortex
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CHROMA_PERSIST_DIR=/app/chroma_data
    depends_on:
      - db
      - redis
    volumes:
      - chroma_data:/app/chroma_data

volumes:
  postgres_data:
  chroma_data:
